name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Bootstrap (melos)
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Format check
        run: |
          dart format --set-exit-if-changed .

      - name: Analyze (app)
        run: |
          cd apps/campus_app
          flutter analyze

      - name: Analyze (packages)
        run: |
          cd packages/core && dart analyze
          cd ../data && dart analyze
          cd ../platform && dart analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Bootstrap (melos)
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Test (core) with coverage
        run: cd packages/core && flutter test --coverage

      - name: Test (data) with coverage
        run: cd packages/data && flutter test --coverage

      - name: Test (platform) with coverage
        run: cd packages/platform && flutter test --coverage

      - name: Test (app) with coverage
        run: cd apps/campus_app && flutter test --coverage

      - name: Coverage gate (core)
        working-directory: packages/core
        run: |
          dart run ../../apps/campus_app/tool/check_coverage.dart coverage/lcov.info 0.60

      - name: Coverage gate (data)
        working-directory: packages/data
        run: |
          dart run ../../apps/campus_app/tool/check_coverage.dart coverage/lcov.info 0.35

      - name: Coverage gate (platform)
        working-directory: packages/platform
        run: |
          dart run ../../apps/campus_app/tool/check_coverage.dart coverage/lcov.info 0.50

      - name: Coverage gate (app)
        working-directory: apps/campus_app
        run: |
          dart run tool/check_coverage.dart coverage/lcov.info 0.25